<!-- App -->
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =================================================================

   - Replace DATA.* with Supabase queries (table names match keys).
   - Replace localStorage auth with @supabase/auth-helpers.
   - Replace localStorage vault with a `vault_records` table
     (FK: patient_id, RLS: auth.uid() = patient_id).
   ================================================================= */

const DATA = window.MEDINEXT_DATA;

    stethoscope: <><path d="M4.8 2.3A.3.3 0 1 0 5 2h-.5C3.7 2 3 2.7 3 3.5V8a4 4 0 0 0 8 0V3.5C11 2.7 10.3 2 9.5 2H9"/><path d="M14 22a4 4 0 0 0 4-4v-2a4 4 0 0 0-8 0v2"/><circle cx="18" cy="10" r="2"/><path d="M7 12v3"/></>,
    flask:     <><path d="M9 2v6L4.5 16a3 3 0 0 0 2.5 4.5h10a3 3 0 0 0 2.5-4.5L15 8V2"/><path d="M9 2h6"/></>,
    pill:      <><rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M5 12h14"/></>,

    clock:     <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    video:     <><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></>,
    check:     <path d="m5 12 5 5L20 7"/>,
    filter:    <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>,
    rupee:     <><path d="M6 4h12M6 8h12M14 16l-7 6h11"/><path d="M6 12c5 0 8-1 8-4"/></>,
    alert:     <><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4M12 17h.01"/></>,
    arrowRight:<path d="M5 12h14M13 5l7 7-7 7"/>,
    sparkles:  <><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></>,
    download:  <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></>,
    plus:      <path d="M12 5v14M5 12h14"/>,

    home:      <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></>,

    truck:     <><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>
  };
  const p = paths[name];
  return (
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
         className={className} aria-hidden="true">{p}</svg>

};

/* ─── routing (hash-based) ───────────────────────────────────── */
const useRoute = () => {
  const parse = () => {
    const h = (window.location.hash || "#/").slice(1);
    const [path, qs] = h.split("?");
    const params = Object.fromEntries(new URLSearchParams(qs || ""));
    const parts = path.split("/").filter(Boolean);
    return { path, parts, params };
  };
  const [route, setRoute] = useState(parse);
  useEffect(() => {
    const onHash = () => { setRoute(parse()); window.scrollTo({ top: 0, behavior: "smooth" }); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
};
const navigate = (to) => { window.location.hash = to; };

/* ─── Auth + Vault via Context (single source of truth) ───── */
const AUTH_KEY = "medinext_user";
const VAULT_KEY = "medinext_vault";
const AppContext = React.createContext(null);

const AppProvider = ({ children }) => {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch { return null; }
  });
  const [vault, setVault] = useState(() => {
    try { return JSON.parse(localStorage.getItem(VAULT_KEY) || "[]"); } catch { return []; }
  });
  const [toast, setToast] = useState(null);

  const signIn = (u) => {
    const finalUser = u || DATA.demoPatient;
    localStorage.setItem(AUTH_KEY, JSON.stringify(finalUser));
    setUser(finalUser);
    if (!localStorage.getItem(VAULT_KEY) || JSON.parse(localStorage.getItem(VAULT_KEY) || "[]").length === 0) {
      localStorage.setItem(VAULT_KEY, JSON.stringify(DATA.demoVault));
      setVault(DATA.demoVault);
    }
    notify("Welcome back, " + finalUser.name.split(" ")[0] + ".");
  };
  const signOut = () => {
    localStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(VAULT_KEY);
    setUser(null); setVault([]);
    notify("Signed out. Your vault is cleared from this device.");
  };
  const vaultAdd = (rec) => {
    const next = [{ ...rec, id: "v_" + Date.now() }, ...vault];
    localStorage.setItem(VAULT_KEY, JSON.stringify(next)); setVault(next);
    notify("Saved to vault.");
  };
  const vaultRemove = (id) => {
    const next = vault.filter(i => i.id !== id);
    localStorage.setItem(VAULT_KEY, JSON.stringify(next)); setVault(next);
    notify("Record removed.");
  };
  const notify = (msg) => {
    setToast({ id: Date.now(), msg });
    setTimeout(() => setToast(t => (t && Date.now() - t.id > 2400) ? null : t), 2800);
  };
  return (
    <AppContext.Provider value={{ user, signIn, signOut, vault, vaultAdd, vaultRemove, notify, toast }}>
      {children}
    </AppContext.Provider>
  );
};

const useApp  = () => React.useContext(AppContext);
const useAuth = () => { const c = useApp(); return { user: c.user, signIn: c.signIn, signOut: c.signOut }; };
const useVault = () => { const c = useApp(); return { items: c.vault, add: c.vaultAdd, remove: c.vaultRemove }; };

/* ─── Toast renderer ─────────────────────────────────────────── */
const ToastHost = () => {
  const c = useApp();
  if (!c?.toast) return null;
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 fade-up">
      <div className="bg-ink-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
        <Icon name="check" className="w-4 h-4 text-heal-400"/> {c.toast.msg}
      </div>
    </div>
  );
};

/* ─── shared UI atoms ────────────────────────────────────────── */
const Btn = ({ as = "button", variant = "primary", size = "md", className = "", children, ...rest }) => {
  const Tag = as;
  const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2.5 text-sm", lg: "px-5 py-3 text-base" };
  const variants = {
    primary:  "bg-brand-500 text-white hover:bg-brand-600 active:bg-brand-700 shadow-sm",
    heal:     "bg-heal-500 text-white hover:bg-heal-600",
    ghost:    "bg-white text-ink-900 hover:bg-ink-50 border border-ink-200",
    dark:     "bg-ink-900 text-white hover:bg-ink-800",
    soft:     "bg-brand-50 text-brand-700 hover:bg-brand-100",
    danger:   "bg-red-500 text-white hover:bg-red-600",
    link:     "text-brand-600 hover:text-brand-700 underline-offset-2 hover:underline"
  };
  return (
    <Tag className={`inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-all ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
      {children}
    </Tag>
  );
};

const Pill = ({ children, tone = "ink", className = "" }) => {
  const tones = {
    ink:    "bg-ink-100 text-ink-700",
    brand:  "bg-brand-50 text-brand-700",
    heal:   "bg-heal-50 text-heal-600",
    amber:  "bg-amber-50 text-amber-700",
    red:    "bg-red-50 text-red-600"
  };
  return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ${tones[tone]} ${className}`}>{children}</span>;
};

const Avatar = ({ name, hue = 200, size = 56 }) => {
  const initials = name.split(/\s+/).slice(0,2).map(n => n[0]).join("").toUpperCase();
  return (
    <div className="rounded-2xl flex items-center justify-center text-white font-bold avatar-gradient shrink-0"
         style={{ width: size, height: size, '--h': hue, fontSize: size * 0.34 }}>
      {initials}
    </div>
  );
};

const Rating = ({ value, reviews, size = "sm" }) => (
  <div className={`inline-flex items-center gap-1.5 font-semibold ${size === "lg" ? "text-base" : "text-sm"}`}>
    <span className="inline-flex items-center gap-0.5 text-amber-500"><Icon name="star" className="w-4 h-4 fill-current" strokeWidth={0}/></span>
    <span className="text-ink-900">{value}</span>
    {reviews != null && <span className="text-ink-500 font-normal">({reviews.toLocaleString()})</span>}
  </div>
);

const SectionTitle = ({ eyebrow, title, sub, action }) => (
  <div className="flex items-end justify-between gap-4 mb-6 flex-wrap">
    <div>
      {eyebrow && <div className="text-xs font-bold tracking-widest uppercase text-brand-600 mb-1">{eyebrow}</div>}
      <h2 className="text-2xl md:text-3xl font-bold text-ink-900">{title}</h2>
      {sub && <p className="text-ink-500 mt-1 max-w-2xl">{sub}</p>}
    </div>
    {action}
  </div>
);

/* ─── NAVBAR ─────────────────────────────────────────────────── */
const Navbar = ({ onLoginClick }) => {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  const { user, signOut } = useAuth();
  const route = useRoute();
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const isHome = route.path === "" || route.path === "/";
  const overlay = isHome && !scrolled;

  const links = [
    { label: "Hospitals", href: "#/hospitals" },
    { label: "Doctors", href: "#/doctors" },
    { label: "Diagnostics", href: "#/pathology" },
    { label: "Pharmacies", href: "#/pharmacies" },
    { label: "Patient Vault", href: "#/vault" }
  ];

  const navText = overlay ? "text-white/85 hover:text-white" : "text-ink-700 hover:text-ink-900";
  const bg = overlay
    ? "bg-transparent border-transparent"
    : "bg-white/90 backdrop-blur-md border-ink-200/80";

  return (
    <header className={`fixed top-0 inset-x-0 z-40 border-b transition-all ${bg}`}>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <a href="#/" className="flex items-center gap-2 group">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-heal-500 flex items-center justify-center text-white font-bold">
            <Icon name="plus" className="w-5 h-5" strokeWidth={3}/>
          </div>
          <div className={`font-display font-extrabold text-lg ${overlay ? "text-white" : "text-ink-900"}`}>
            Medi<span className="text-brand-500">Next</span>
          </div>
        </a>

        <nav className="hidden lg:flex items-center gap-1">
          {links.map(l => (
            <a key={l.href} href={l.href}
               className={`relative px-3 py-2 text-sm font-medium transition-colors ${navText} group`}>
              {l.label}
              <span className="absolute left-3 right-3 -bottom-0.5 h-0.5 bg-brand-500 rounded-full scale-x-0 group-hover:scale-x-100 transition-transform origin-left"/>
            </a>
          ))}
        </nav>

        <div className="flex items-center gap-2">
          <a href="tel:+911800633639" className={`hidden md:inline-flex items-center gap-2 text-sm font-semibold ${overlay ? "text-white" : "text-ink-900"}`} title="24x7 Helpline">
            <span className={`w-7 h-7 rounded-lg flex items-center justify-center ${overlay ? "bg-white/10" : "bg-brand-50 text-brand-600"}`}>
              <Icon name="phone" className="w-4 h-4"/>
            </span>
            <span className="hidden lg:inline">1800-MEDI-NEXT</span>
          </a>

          {user ? (
            <div className="hidden lg:flex items-center gap-2">
              <a href="#/vault" className="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-ink-100">
                <Avatar name={user.name} hue={user.avatar_hue || 200} size={32}/>
                <span className="text-sm font-medium text-ink-900">{user.name.split(" ")[0]}</span>
              </a>
              <button onClick={signOut} className="p-2 rounded-xl text-ink-500 hover:bg-ink-100" title="Sign out">
                <Icon name="logout" className="w-5 h-5"/>
              </button>
            </div>
          ) : (
            <Btn onClick={onLoginClick} size="sm" variant={overlay ? "ghost" : "primary"} className="hidden md:inline-flex">
              <Icon name="user" className="w-4 h-4"/> Sign in
            </Btn>
          )}

          <button className={`lg:hidden p-2 rounded-xl ${overlay ? "text-white" : "text-ink-900"}`}
                  onClick={() => setMobileOpen(!mobileOpen)} aria-label="Menu">
            <Icon name={mobileOpen ? "x" : "menu"} className="w-6 h-6"/>
          </button>
        </div>
      </div>

      {mobileOpen && (
        <div className="lg:hidden bg-white border-t border-ink-200 fade-up">
          <div className="px-4 py-4 flex flex-col gap-1">
            {links.map(l => (
              <a key={l.href} href={l.href}
                 onClick={() => setMobileOpen(false)}
                 className="px-3 py-3 rounded-xl text-ink-800 font-medium hover:bg-ink-50">{l.label}</a>
            ))}
            {!user && (
              <Btn onClick={() => { setMobileOpen(false); onLoginClick(); }} className="mt-2"><Icon name="user" className="w-4 h-4"/> Sign in</Btn>
            )}
            {user && (
              <button onClick={() => { signOut(); setMobileOpen(false); }} className="mt-2 px-3 py-3 rounded-xl text-red-600 font-medium hover:bg-red-50 text-left flex items-center gap-2">
                <Icon name="logout" className="w-4 h-4"/> Sign out
              </button>
            )}

        </div>

/* ─── SEARCH BAR (unified) ───────────────────────────────────── */
const SearchBar = ({ inHero = false, initial = {} }) => {
  const [tab, setTab] = useState(initial.kind || "doctors");
  const [q, setQ] = useState(initial.q || "");
  const [city, setCity] = useState(initial.city || "Delhi");
  const tabs = [
    { id: "doctors", label: "Doctors", icon: "stethoscope" },
    { id: "hospitals", label: "Hospitals", icon: "building" },
    { id: "pathology", label: "Lab Tests", icon: "flask" },
    { id: "pharmacies", label: "Pharmacy", icon: "pill" }
  ];
  const submit = (e) => {
    e?.preventDefault?.();
    const params = new URLSearchParams();
    if (q) params.set("q", q);
    if (city) params.set("city", city);
    navigate(`/${tab}?${params.toString()}`);
  };

  return (
    <div className={`${inHero ? "" : "card-soft"} rounded-2xl ${inHero ? "bg-white" : "bg-white border border-ink-200"}`}>
      <div className="flex items-center gap-1 px-2 pt-2 overflow-x-auto no-scrollbar">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
                  className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all
                    ${tab === t.id ? "bg-brand-50 text-brand-700" : "text-ink-500 hover:text-ink-900 hover:bg-ink-50"}`}>
            <Icon name={t.icon} className="w-4 h-4"/> {t.label}
          </button>
        ))}
      </div>

      <form onSubmit={submit} className="flex flex-col md:flex-row items-stretch gap-2 p-2">
        <div className="flex items-center gap-2 flex-1 px-3 rounded-xl border border-ink-200 hover:border-brand-400 focus-within:border-brand-500 focus-within:ring-2 focus-within:ring-brand-100 bg-white">
          <Icon name="search" className="w-5 h-5 text-ink-400"/>
          <input value={q} onChange={e => setQ(e.target.value)}
                 placeholder={tab === "doctors" ? "Search 'Cardiologist', 'Dr. Rao'…" : tab === "hospitals" ? "Search hospital, specialty…" : tab === "pathology" ? "Search 'HbA1c', 'CBC', 'Thyroid'…" : "Search 'Pharmacy near me'…"}
                 className="w-full py-3.5 text-sm placeholder:text-ink-400 bg-transparent"/>
        </div>
        <div className="flex items-center gap-2 px-3 rounded-xl border border-ink-200 hover:border-brand-400 focus-within:border-brand-500 focus-within:ring-2 focus-within:ring-brand-100 bg-white md:w-48">
          <Icon name="map" className="w-5 h-5 text-ink-400"/>
          <select value={city} onChange={e => setCity(e.target.value)}
                  className="w-full py-3.5 text-sm bg-transparent text-ink-900">
            {DATA.CITIES.map(c => <option key={c}>{c}</option>)}
          </select>
        </div>
        <Btn type="submit" size="lg" className="md:px-7">
          <Icon name="search" className="w-4 h-4"/> Search
        </Btn>
      </form>
    </div>
  );
};

/* ─── LISTING SHELL (filters + grid) ─────────────────────────── */
const ListingShell = ({ kind, params }) => {
  const all = DATA[kind] || [];
  const [city, setCity] = useState(params.city || "");
  const [q, setQ] = useState(params.q || "");
  const [specialty, setSpecialty] = useState("");
  const [sort, setSort] = useState("relevance");
  const [feeMax, setFeeMax] = useState(5000);
  const [onlyVideo, setOnlyVideo] = useState(false);
  const [only24x7, setOnly24x7] = useState(false);
  const [onlyHome, setOnlyHome] = useState(false);
  const [onlyCashless, setOnlyCashless] = useState(false);
  const resetAll = () => { setCity(""); setSpecialty(""); setFeeMax(5000); setOnlyVideo(false); setOnly24x7(false); setOnlyHome(false); setOnlyCashless(false); setQ(""); };

  const filtered = useMemo(() => {
    let arr = all.slice();
    if (city) arr = arr.filter(x => x.city === city);
    if (q) {
      const ql = q.toLowerCase();
      arr = arr.filter(x =>
        (x.name||"").toLowerCase().includes(ql) ||
        (x.specialty||"").toLowerCase().includes(ql) ||
        (x.specialties||[]).join(" ").toLowerCase().includes(ql) ||
        (x.popular_tests||[]).join(" ").toLowerCase().includes(ql) ||
        (x.locality||"").toLowerCase().includes(ql)
      );
    }
    if (specialty) {
      arr = arr.filter(x =>
        (x.specialty === specialty) ||
        (x.specialties || []).includes(specialty)
      );
    }
    if (kind === "doctors") {
      arr = arr.filter(x => x.fee <= feeMax);
      if (onlyVideo) arr = arr.filter(x => x.available_modes.includes("Video"));
    }
    if (kind === "pathology" || kind === "pharmacies" || kind === "hospitals") {
      if (only24x7) arr = arr.filter(x => x.open_24x7 || x.emergency_24x7);
    }
    if (kind === "pathology" || kind === "pharmacies") {
      if (onlyHome) arr = arr.filter(x => x.home_collection || x.home_delivery);
    }
    if (kind === "hospitals" && onlyCashless) arr = arr.filter(x => x.cashless);
    if (sort === "rating") arr.sort((a,b) => (b.rating||0) - (a.rating||0));
    if (sort === "price-low" && kind === "doctors") arr.sort((a,b) => (a.fee||0) - (b.fee||0));
    if (sort === "price-low" && kind === "pathology") arr.sort((a,b) => (a.starting_price||0) - (b.starting_price||0));
    if (sort === "reviews") arr.sort((a,b) => (b.reviews||0) - (a.reviews||0));
    return arr;
  }, [all, city, q, specialty, sort, feeMax, onlyVideo, only24x7, onlyHome, kind]);

  const titles = {
    doctors:    { h: "Doctors", e: "Find a specialist" },
    hospitals:  { h: "Hospitals", e: "Hospitals near you" },
    pathology:  { h: "Diagnostics & Labs", e: "Book lab tests" },
    pharmacies: { h: "Pharmacies", e: "Order medicines" }
  }[kind] || { h: kind, e: "" };

  return (
    <main className="pt-20 pb-16">
      <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        {/* Re-search bar */}
        <div className="mt-4">
          <SearchBar initial={{ kind, q, city }}/>
        </div>

        <div className="mt-6 grid lg:grid-cols-12 gap-6">
          {/* Filters */}
          <aside className="lg:col-span-3">
            <div className="bg-white border border-ink-200 rounded-2xl p-5 sticky top-20">
              <div className="flex items-center justify-between mb-4">
                <div className="font-bold text-ink-900 inline-flex items-center gap-2"><Icon name="filter" className="w-4 h-4"/> Filters</div>
                <button onClick={resetAll} className="text-xs font-semibold text-brand-600 hover:text-brand-700">Reset</button>
              </div>

              <div className="space-y-5">
                <div>
                  <label className="text-xs font-semibold text-ink-700 uppercase tracking-wide">City</label>
                  <select value={city} onChange={e => setCity(e.target.value)} className="mt-2 w-full text-sm py-2.5 px-3 rounded-xl border border-ink-200 bg-white">
                    <option value="">All cities</option>
                    {DATA.CITIES.map(c => <option key={c}>{c}</option>)}
                  </select>
                </div>

                {(kind === "doctors" || kind === "hospitals") && (
                  <div>
                    <label className="text-xs font-semibold text-ink-700 uppercase tracking-wide">Specialty</label>
                    <select value={specialty} onChange={e => setSpecialty(e.target.value)} className="mt-2 w-full text-sm py-2.5 px-3 rounded-xl border border-ink-200 bg-white">
                      <option value="">All specialties</option>
                      {DATA.SPECIALTIES.map(s => <option key={s}>{s}</option>)}
                    </select>
                  </div>
                )}

                {kind === "doctors" && (
                  <>
                    <div>
                      <label className="text-xs font-semibold text-ink-700 uppercase tracking-wide flex items-center justify-between">
                        <span>Max consult fee</span><span className="text-brand-600">₹{feeMax}</span>
                      </label>
                      <input type="range" min={300} max={3000} step={100} value={feeMax} onChange={e => setFeeMax(+e.target.value)} className="mt-2 w-full accent-brand-500"/>
                    </div>
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={onlyVideo} onChange={e => setOnlyVideo(e.target.checked)} className="rounded accent-brand-500"/>
                      <span className="text-sm text-ink-700">Video consult available</span>
                    </label>
                  </>
                )}

                {(kind === "pathology" || kind === "hospitals" || kind === "pharmacies") && (
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={only24x7} onChange={e => setOnly24x7(e.target.checked)} className="rounded accent-brand-500"/>
                    <span className="text-sm text-ink-700">Open 24×7</span>
                  </label>
                )}

                {(kind === "pathology" || kind === "pharmacies") && (
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={onlyHome} onChange={e => setOnlyHome(e.target.checked)} className="rounded accent-brand-500"/>
                    <span className="text-sm text-ink-700">{kind === "pathology" ? "Home collection" : "Home delivery"}</span>
                  </label>
                )}

                {kind === "hospitals" && (
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked={onlyCashless} onChange={e => setOnlyCashless(e.target.checked)} className="rounded accent-brand-500"/>
                    <span className="text-sm text-ink-700">Cashless insurance accepted</span>
                  </label>
                )}
              </div>
            </div>
          </aside>

          {/* Results */}
          <div className="lg:col-span-9">
            <div className="flex items-end justify-between gap-3 flex-wrap mb-4">
              <div>
                <div className="text-xs font-bold uppercase tracking-widest text-brand-600">{titles.e}</div>
                <h1 className="text-2xl sm:text-3xl font-bold text-ink-900">
                  {filtered.length} {titles.h.toLowerCase()} found{city ? ` in ${city}` : ""}
                </h1>
              </div>
              <select value={sort} onChange={e => setSort(e.target.value)} className="text-sm py-2.5 px-3 rounded-xl border border-ink-200 bg-white">
                <option value="relevance">Relevance</option>
                <option value="rating">Top rated</option>
                <option value="reviews">Most reviewed</option>
                {(kind === "doctors" || kind === "pathology") && <option value="price-low">Price: low to high</option>}
              </select>
            </div>

            {filtered.length === 0 ? (
              <div className="bg-white border border-dashed border-ink-200 rounded-2xl p-12 text-center">
                <div className="w-14 h-14 mx-auto rounded-2xl bg-ink-100 text-ink-500 flex items-center justify-center"><Icon name="search" className="w-6 h-6"/></div>
                <div className="mt-4 font-bold text-ink-900">No matches found</div>
                <div className="text-sm text-ink-500 mt-1">Try a different city or clear some filters.</div>
                <div className="mt-4 flex justify-center gap-2 flex-wrap">
                  <Btn size="sm" variant="ghost" onClick={resetAll}>Reset filters</Btn>
                  <Btn size="sm" as="a" href={`#/${kind}`}>Show all {titles.h.toLowerCase()}</Btn>
                </div>
              </div>
            ) : (
              <div className={kind === "hospitals" ? "grid sm:grid-cols-2 gap-4" : "grid sm:grid-cols-2 gap-4"}>
                {filtered.map(item => {
                  if (kind === "doctors") return <DoctorCard key={item.id} doctor={item}/>;
                  if (kind === "hospitals") return <HospitalCard key={item.id} hospital={item}/>;
                  if (kind === "pathology") return <LabCard key={item.id} lab={item}/>;
                  if (kind === "pharmacies") return <PharmacyCard key={item.id} pharmacy={item}/>;
                  return null;
                })}
              </div>
            )}
          </div>
        </div>
      </section>
    </main>
  );
};

/* ─── Masked ABHA ID with reveal ─────────────────────────────── */
const MaskedAbha = ({ id }) => {
  const [shown, setShown] = useState(false);
  if (!id) return null;
  const parts = id.split("-");
  const masked = parts.length === 4 ? `${parts[0]}-••••-••••-${parts[3]}` : id;
  return (
    <span className="inline-flex items-center gap-1.5">
      ABHA <span className="font-mono text-white">{shown ? id : masked}</span>
      <button onClick={() => setShown(!shown)} className="text-[11px] uppercase tracking-wide text-brand-300 hover:text-white">
        {shown ? "hide" : "reveal"}
      </button>
    </span>
  );
};

const ShareVaultModal = ({ items, onClose }) => {
  const c = useApp();
  const [doctorId, setDoctorId] = useState(DATA.doctors[0].id);
  const [selected, setSelected] = useState(items.map(i => i.id));
  const [hours, setHours] = useState(72);
  const [step, setStep] = useState(1);
  const doc = DATA.doctors.find(d => d.id === doctorId);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  return (
    <Modal onClose={onClose} title="Share records with a doctor">
      {step === 1 && (
        <div>
          <Field label="Choose doctor">
            <select value={doctorId} onChange={e => setDoctorId(e.target.value)} className="w-full py-2.5 px-3 rounded-xl border border-ink-200 text-sm">
              {DATA.doctors.map(d => <option key={d.id} value={d.id}>{d.name} — {d.specialty} ({d.city})</option>)}
            </select>
          </Field>
          <div className="mt-3">
            <div className="text-xs font-semibold uppercase tracking-wide text-ink-500 mb-1.5">Select records ({selected.length} of {items.length})</div>
            <div className="border border-ink-200 rounded-xl max-h-52 overflow-y-auto">
              {items.length === 0 && <div className="p-4 text-sm text-ink-500">No records to share.</div>}
              {items.map(i => (
                <label key={i.id} className="flex items-start gap-2 p-3 border-b border-ink-100 last:border-b-0 cursor-pointer hover:bg-ink-50">
                  <input type="checkbox" checked={selected.includes(i.id)} onChange={() => toggle(i.id)} className="mt-1 accent-brand-500"/>
                  <div className="min-w-0">
                    <div className="text-sm font-semibold text-ink-900 truncate">{i.title}</div>
                    <div className="text-xs text-ink-500">{i.type} · {i.source} · {i.date}</div>
                  </div>
                </label>
              ))}
            </div>
          </div>
          <Field label="Access valid for">
            <select value={hours} onChange={e => setHours(+e.target.value)} className="w-full py-2.5 px-3 rounded-xl border border-ink-200 text-sm">
              <option value={24}>24 hours</option>
              <option value={72}>3 days</option>
              <option value={168}>7 days</option>

          </Field>
          <div className="mt-5 flex justify-end gap-2">
            <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
            <Btn variant="heal" disabled={!selected.length} onClick={() => setStep(2)}>Generate consent</Btn>
          </div>
        </div>
      )}
      {step === 2 && (
        <div className="text-center py-2">
          <div className="w-14 h-14 mx-auto rounded-2xl bg-heal-50 text-heal-600 flex items-center justify-center"><Icon name="check" className="w-7 h-7" strokeWidth={3}/></div>
          <h3 className="mt-4 text-xl font-extrabold text-ink-900">Consent created</h3>

          <div className="mt-3 inline-block bg-ink-50 border border-ink-200 rounded-xl px-3 py-1.5 text-xs font-mono text-ink-700">

/* ─── MODAL SHELL ────────────────────────────────────────────── */
const Modal = ({ onClose, title, children }) => {
  const dialogRef = useRef(null);
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    // Focus first focusable element
    setTimeout(() => {
      const el = dialogRef.current?.querySelector("input,select,textarea,button");
      el?.focus?.();
    }, 50);
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink-900/60 p-0 sm:p-4 fade-up" onClick={onClose} role="presentation">
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-label={title}
           className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 fade-up max-h-[92vh] overflow-y-auto"
           onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="font-display font-bold text-lg text-ink-900">{title}</div>
          <button onClick={onClose} className="p-2 rounded-xl text-ink-500 hover:bg-ink-100" aria-label="Close"><Icon name="x" className="w-5 h-5"/></button>
        </div>
        {children}
      </div>
    </div>
  );
};

/* ─── APP SHELL / ROUTER ─────────────────────────────────────── */
function App() {
  const route = useRoute();
  const [loginOpen, setLoginOpen] = useState(false);
  const [booking, setBooking] = useState(null);

  // Render based on route
  const renderRoute = () => {
    const [first, second] = route.parts;
    if (!first) return <HomePage onLoginClick={() => setLoginOpen(true)}/>;
    // key forces remount when query params change so filter state re-initialises
    const lKey = first + "?" + new URLSearchParams(route.params).toString();
    if (first === "hospitals" && !second) return <ListingShell key={lKey} kind="hospitals" params={route.params}/>;
    if (first === "doctors" && !second)   return <ListingShell key={lKey} kind="doctors" params={route.params}/>;
    if (first === "pathology" && !second) return <ListingShell key={lKey} kind="pathology" params={route.params}/>;
    if (first === "pharmacies" && !second)return <ListingShell key={lKey} kind="pharmacies" params={route.params}/>;
    if (first === "hospital" && second)   return <HospitalDetail slug={second}/>;
    if (first === "doctor" && second)     return <DoctorDetail slug={second} onBook={(d, m) => setBooking({ doctor: d, mode: m })}/>;
    if (first === "pathology" && second)  return <PathologyDetail slug={second}/>;
    if (first === "pharmacy" && second)   return <PharmacyDetail slug={second}/>;
    if (first === "vault")                return <VaultPage onLoginClick={() => setLoginOpen(true)}/>;
    if (first === "contact")              return <ContactPage/>;
    if (first === "list-with-us")         return <ListWithUsPage/>;
    if (first === "privacy")              return <PrivacyPage/>;
    return <NotFound/>;
  };

  return (
    <>
      <Navbar onLoginClick={() => setLoginOpen(true)}/>
      <div className="min-h-screen">{renderRoute()}</div>
      <Footer/>
      <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)}/>
      <BookingModal booking={booking} onClose={() => setBooking(null)}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
